name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18.18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  package:
    name: Package validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Pack the tarball
        run: npm pack --pack-destination /tmp

      - name: Install the tarball into a clean project and run it
        run: |
          set -euo pipefail
          mkdir -p /tmp/consumer/src
          cd /tmp/consumer
          npm init -y >/dev/null
          printf 'export const value = 1;\n' > src/index.ts
          npm install --no-audit --no-fund /tmp/little-owl-code-*.tgz
          npx little-owl --version
          npx little-owl check --json > result.json
          node -e "const r=require('./result.json'); if(r.schemaVersion!==1) throw new Error('bad schema'); if(typeof r.metrics.overall!=='number') throw new Error('no metrics');"
          echo "packaged artifact works"

  dogfood:
    name: Little Owl reviews itself
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Check this codebase with Little Owl
        run: node dist/cli.js ci
