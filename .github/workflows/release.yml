name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted publishing needs a newer npm than Node 20 ships with.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Verify before publishing
        run: pnpm check

      - name: Check the tag matches package.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi

      # Trusted publishing: npm verifies this workflow's OIDC identity instead of
      # a long-lived token. npm is restricting tokens that bypass 2FA (account
      # changes Aug 2026, direct publishing Jan 2027), and there is no secret
      # here to leak or rotate. Needs npm >= 11.5.1, hence the upgrade above.
      #
      # Configure it once at npmjs.com → the package → Settings → Trusted
      # publisher, pointing at this repository and `release.yml`.
      - name: Publish to npm
        run: npm publish --provenance --access public
